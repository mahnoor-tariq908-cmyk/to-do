<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ToDo App</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: "class"
        };
    </script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            transition: background 0.4s ease, color 0.3s ease;
        }

        /* Light background */

        body {
            background:
                radial-gradient(circle at top left, #e9d5ff 0%, transparent 35%),
                radial-gradient(circle at bottom right, #ddd6fe 0%, transparent 35%),
                linear-gradient(135deg, #f8fafc, #ede9fe);
        }

        /* Dark background */

        html.dark body {
            background:
                radial-gradient(circle at top left, #312e81 0%, transparent 30%),
                radial-gradient(circle at bottom right, #581c87 0%, transparent 35%),
                linear-gradient(135deg, #0f172a, #17112b);
        }

        /* Task cards created by JS */

        #taskList > div {
            background: rgba(255, 255, 255, 0.95) !important;
            color: #172033 !important;
            border: 1px solid #d8b4fe !important;
            border-radius: 18px !important;
            box-shadow: 0 8px 25px rgba(91, 33, 182, 0.10);
            transition: 0.3s ease;
        }

        #taskList > div:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(91, 33, 182, 0.16);
        }

        html.dark #taskList > div {
            background: #1e293b !important;
            color: #f8fafc !important;
            border-color: #475569 !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* Better readability for generated text */

        html.dark #taskList p,
        html.dark #taskList span,
        html.dark #taskList h3 {
            color: #f8fafc !important;
        }

        /* Scrollbar */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }

        ::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 20px;
        }

        html.dark ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        html.dark ::-webkit-scrollbar-thumb {
            background: #a78bfa;
        }

    </style>

</head>


<body class="min-h-screen text-slate-800 dark:text-white transition-all duration-300">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="px-5 py-6">

        <div
            class="
                max-w-4xl
                mx-auto
                flex
                items-center
                justify-between
            "
        >

            <!-- Logo -->

            <div class="flex items-center gap-3">

                <div
                    class="
                        w-11
                        h-11
                        rounded-full
                        bg-violet-600
                        dark:bg-violet-500
                        text-white
                        flex
                        items-center
                        justify-center
                        shadow-lg
                    "
                >

                    <i class="fa-solid fa-check"></i>

                </div>


                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white">

                    ToDo

                    <span class="text-violet-600 dark:text-violet-300">
                        App
                    </span>

                </h1>

            </div>


            <!-- THEME BUTTON -->

            <button
                id="themeBtn"
                type="button"
                class="
                    w-11
                    h-11
                    rounded-full

                    bg-white
                    dark:bg-slate-800

                    border-2
                    border-violet-300
                    dark:border-violet-400

                    text-violet-700
                    dark:text-yellow-300

                    flex
                    items-center
                    justify-center

                    shadow-md

                    hover:scale-105

                    transition
                    duration-300
                "
            >

                <i
                    id="themeIcon"
                    class="fa-solid fa-sun text-yellow-500"
                ></i>

            </button>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main
        class="
            max-w-3xl
            mx-auto
            px-4
            pb-12
        "
    >


        <!-- =========================
             PROGRESS CARD
        ========================== -->

        <section
            class="
                rounded-3xl
                p-5
                sm:p-7

                bg-white
                dark:bg-slate-800

                border
                border-violet-200
                dark:border-slate-700

                shadow-xl
                dark:shadow-black/30

                transition-all
                duration-300
            "
        >

            <div
                class="
                    flex
                    items-center
                    gap-5
                "
            >


                <!-- ICON -->

                <div
                    class="
                        hidden
                        sm:flex

                        w-24
                        h-24

                        rounded-2xl

                        bg-violet-100
                        dark:bg-violet-900/60

                        border
                        border-violet-200
                        dark:border-violet-700

                        items-center
                        justify-center

                        text-5xl

                        shadow-inner
                    "
                >

                    📝

                </div>



                <!-- CONTENT -->

                <div class="flex-1">


                    <div
                        class="
                            flex
                            items-center
                            justify-between
                            gap-4
                        "
                    >

                        <div>

                            <h2
                                class="
                                    text-2xl
                                    sm:text-3xl
                                    font-bold

                                    text-slate-900
                                    dark:text-white
                                "
                            >
                                ToDo App
                            </h2>


                            <p
                                class="
                                    mt-1
                                    text-slate-500
                                    dark:text-slate-300
                                "
                            >
                                Keep it up! 🚀
                            </p>

                        </div>



                        <!-- PROGRESS CIRCLE -->

                        <div
                            id="progressCircle"

                            class="
                                w-20
                                h-20

                                rounded-full

                                shrink-0

                                flex
                                items-center
                                justify-center

                                bg-violet-600
                                dark:bg-violet-500

                                shadow-lg
                            "
                        >

                            <div
                                id="circleInner"

                                class="
                                    w-16
                                    h-16

                                    rounded-full

                                    bg-white
                                    dark:bg-slate-900

                                    text-violet-700
                                    dark:text-violet-200

                                    flex
                                    items-center
                                    justify-center
                                "
                            >

                                <span
                                    id="percent"
                                    class="font-bold"
                                >
                                    0%
                                </span>

                            </div>

                        </div>

                    </div>



                    <!-- PROGRESS BAR -->

                    <div class="mt-5">

                        <div
                            class="
                                h-3

                                rounded-full

                                bg-slate-200
                                dark:bg-slate-700

                                border
                                border-slate-300
                                dark:border-slate-600

                                overflow-hidden
                            "
                        >

                            <div
                                id="progressBar"

                                class="
                                    h-full
                                    w-0

                                    rounded-full

                                    bg-gradient-to-r
                                    from-violet-600
                                    to-fuchsia-500

                                    transition-all
                                    duration-500
                                "
                            ></div>

                        </div>


                        <p
                            id="progressText"

                            class="
                                mt-2
                                text-sm

                                text-slate-500
                                dark:text-slate-300
                            "
                        >
                            0 tasks added
                        </p>

                    </div>

                </div>

            </div>

        </section>



        <!-- =========================
             ADD TASK
        ========================== -->

        <section
            class="
                mt-5
                p-3

                rounded-2xl

                bg-white
                dark:bg-slate-800

                border
                border-violet-200
                dark:border-slate-700

                shadow-lg
                dark:shadow-black/20
            "
        >

            <div class="flex gap-3">


                <input
                    id="taskInput"

                    type="text"

                    placeholder="Write your task..."

                    class="
                        flex-1
                        min-w-0

                        px-4
                        py-4

                        rounded-xl

                        bg-slate-50
                        dark:bg-slate-900

                        border
                        border-slate-300
                        dark:border-slate-600

                        text-slate-900
                        dark:text-white

                        placeholder-slate-400
                        dark:placeholder-slate-400

                        outline-none

                        focus:border-violet-500
                        dark:focus:border-violet-400

                        focus:ring-2
                        focus:ring-violet-200
                        dark:focus:ring-violet-900

                        transition
                    "
                >


                <button
                    id="addBtn"

                    type="button"

                    class="
                        w-14

                        rounded-xl

                        bg-gradient-to-r
                        from-violet-600
                        to-fuchsia-500

                        text-white
                        text-xl

                        shadow-md

                        hover:scale-105

                        transition
                    "
                >

                    <i class="fa-solid fa-plus"></i>

                </button>

            </div>

        </section>



        <!-- =========================
             SEARCH
        ========================== -->

        <section
            class="
                mt-4
                p-3

                rounded-2xl

                bg-white
                dark:bg-slate-800

                border
                border-violet-200
                dark:border-slate-700

                shadow-lg
                dark:shadow-black/20
            "
        >

            <div class="relative">

                <i
                    class="
                        fa-solid
                        fa-magnifying-glass

                        absolute
                        left-4
                        top-1/2
                        -translate-y-1/2

                        text-slate-400
                        dark:text-slate-500
                    "
                ></i>


                <input
                    id="searchInput"

                    type="text"

                    placeholder="Search tasks..."

                    class="
                        w-full

                        px-11
                        py-3

                        rounded-xl

                        bg-slate-50
                        dark:bg-slate-900

                        border
                        border-slate-300
                        dark:border-slate-600

                        text-slate-900
                        dark:text-white

                        placeholder-slate-400
                        dark:placeholder-slate-400

                        outline-none

                        focus:border-violet-500
                        dark:focus:border-violet-400

                        focus:ring-2
                        focus:ring-violet-200
                        dark:focus:ring-violet-900

                        transition
                    "
                >

            </div>

        </section>



        <!-- =========================
             TASK LIST
        ========================== -->

        <div
            id="taskList"
            class="mt-4 space-y-3"
        ></div>



        <!-- =========================
             EMPTY STATE
        ========================== -->

        <div
            id="emptyState"

            class="
                mt-4

                p-10

                rounded-2xl

                bg-white
                dark:bg-slate-800

                border
                border-violet-200
                dark:border-slate-700

                shadow-xl

                text-center
            "
        >

            <div
                class="
                    text-5xl
                    mb-4
                "
            >
                📝
            </div>


            <h3
                class="
                    text-xl
                    font-bold

                    text-slate-900
                    dark:text-white
                "
            >
                No tasks yet ✨
            </h3>


            <p
                class="
                    mt-2

                    text-slate-500
                    dark:text-slate-300
                "
            >
                Add your first task and get started!
            </p>

        </div>


    </main>



    <!-- JS -->

    <script
        type="module"
        src="/src/main.js"
    ></script>


</body>

</html>
